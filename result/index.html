<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Physarum Interactive Wallpaper</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: auto;
      cursor: crosshair;
    }

    #stats {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      color: #d8e3ff;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(148, 177, 255, 0.4);
      font: 12px/1.3 monospace;
      padding: 6px 8px;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="stats"></div>
  <script src="./script.js"></script>
</body>
</html>
