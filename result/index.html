<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Physarum Interactive Wallpaper</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: auto;
      cursor: crosshair;
    }

    #hud {
      position: fixed;
      left: 12px;
      top: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
      user-select: none;
      pointer-events: none;
      white-space: pre;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud"></div>
  <script src="./script.js"></script>
</body>
</html>
